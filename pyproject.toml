[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safeinfer"
version = "0.1.0"
description = "LLM inference engine with paged KV cache, continuous batching, and in-loop activation safety probes"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.5",          # SDPA enable_gqa
    "safetensors",
    "numpy",
    "huggingface_hub",
]

[project.optional-dependencies]
# transformers is only a test oracle and the benchmark baseline, never an engine dependency.
bench = ["transformers>=4.45"]
# Offline probe pipeline (datasets / collect / judge / train).
safety = ["transformers>=4.45", "pandas", "pyarrow"]
dev = ["transformers>=4.45", "pandas", "pytest", "hypothesis", "ruff==0.15.12"]

[tool.setuptools.packages.find]
include = ["safeinfer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
# Explicit so results do not shift with ruff's defaults across versions.
select = ["E", "F", "I", "B", "C4", "SIM", "UP"]
